name: Isolated contribution Obsidian E2E
on:
  push:
    branches: [ci/isolated-startup-e2e]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  obsidian:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fc2b35e0dc8538a639ba7efd8bcfd97001fc769d
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Prepare ephemeral Linux host
        run: sudo apt-get update && sudo apt-get install -y xvfb libasound2t64 libnss3 libgbm1
      - name: Build exact contribution source
        run: |
          mkdir -p contribution-e2e-evidence
          git rev-parse HEAD | tee contribution-e2e-evidence/source.txt
          npm ci
          npm run build
          sha256sum main.js > contribution-e2e-evidence/bundle.sha256
      - name: Prepare disposable CouchDB
        run: |
          cat > .test.env <<'EOF'
          hostname=http://127.0.0.1:5989/
          dbname=contribution-e2e
          username=admin
          password=testpassword
          EOF
          npm run test:docker-couchdb:start
      - name: Install isolated Obsidian AppImage
        env:
          E2E_OBSIDIAN_VERSION: 1.14.5
          E2E_OBSIDIAN_APPIMAGE_URL: https://github.com/obsidianmd/obsidian-releases/releases/download/v1.14.5/Obsidian-1.14.5.AppImage
        run: npm run test:e2e:obsidian:install-appimage
      - name: Real configured startup and restart
        run: npm run test:e2e:obsidian:startup-scan 2>&1 | tee contribution-e2e-evidence/startup.log
      - name: Select the Vault renderer instead of detached settings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'node_modules/@vrtmrz/obsidian-test-session/dist/ui.js';
          const source = fs.readFileSync(path, 'utf8');
          const marker = 'const page = context.pages()[0] ??';
          if (source.split(marker).length !== 2) throw new Error('Unexpected renderer selection contract');
          const replacement = `let vaultPage;
                  for (const candidate of context.pages()) {
                      if (await candidate.evaluate(() => !!globalThis.app?.vault).catch(() => false)) {
                          vaultPage = candidate;
                          break;
                      }
                  }
                  const page = vaultPage ?? context.pages().find(p => p.url().startsWith('app://obsidian.md')) ?? context.pages()[0] ??`;
          fs.writeFileSync(path, source.replace(marker, replacement));
          NODE
      - name: Add failure-only session diagnostics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'node_modules/@vrtmrz/obsidian-test-session/dist/session.js';
          const source = fs.readFileSync(path, 'utf8');
          const marker = '        const output = app.output();';
          if (source.split(marker).length !== 2) throw new Error('Unexpected diagnostic insertion point');
          const diagnostic = `        try {
                      await withObsidianPage(remoteDebuggingPort, async (page) => {
                          console.error('SESSION_FAILURE_STATE', JSON.stringify(await page.evaluate(() => ({
                              url: location.href,
                              appPresent: !!globalThis.app,
                              manifestPresent: !!globalThis.app?.plugins?.manifests?.['obsidian-livesync'],
                              pluginLoaded: !!globalThis.app?.plugins?.plugins?.['obsidian-livesync'],
                              documentReady: document.readyState,
                              modals: [...document.querySelectorAll('.modal-title')].map(e => e.textContent)
                          }))));
                          await page.screenshot({path:'contribution-e2e-evidence/session-failure.png'});
                      });
                  } catch (diagnosticError) { console.error('SESSION_DIAGNOSTIC_ERROR', String(diagnosticError)); }
          `;
          fs.writeFileSync(path, source.replace(marker, diagnostic + marker));
          NODE
      - name: Real two-Vault synchronisation
        run: npm run test:e2e:obsidian:two-vault-sync 2>&1 | tee contribution-e2e-evidence/two-vault.log
      - name: Stop disposable service
        if: always()
        timeout-minutes: 2
        run: timeout 60s docker rm -f couchdb-test || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: contribution-obsidian-e2e
          path: contribution-e2e-evidence/
